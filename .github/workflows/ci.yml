name: CI

on:
  pull_request:
    # edited: PR 본문만 고쳐도 review-note 를 다시 검사한다
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  review-note:
    # PR 본문에 submit 스킬의 자체 리뷰 결과가 있어야 통과
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 자체 리뷰 섹션 확인
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -q '## 자체 리뷰' && printf '%s' "$BODY" | grep -q '비밀값 없음: *예'; then
            echo "자체 리뷰 확인"
          else
            echo "PR 본문에 '## 자체 리뷰' 와 '비밀값 없음: 예' 가 필요합니다. submit 스킬로 PR을 올리세요."
            exit 1
          fi

  repo-check:
    # 두 곳에 있는 review-pr 스킬이 같은지 확인 (Claude Code 용, Codex 용)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmp .claude/skills/review-pr/SKILL.md .agents/skills/review-pr/SKILL.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "import main"

  docker:
    # Dockerfile 이 깨지지 않았는지 이미지 빌드만 확인한다
    runs-on: ubuntu-latest
    needs: [web, ai]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example deploy/.env
      - run: docker compose -f deploy/docker-compose.yml build
