# 로컬과 VM 공용. 저장소 루트에서:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  web:
    build: ../web
    env_file: .env
    environment:
      AI_SERVICE_URL: http://ai:8000
    depends_on: [ai]
    restart: unless-stopped

  ai:
    build: ../ai
    env_file: .env
    restart: unless-stopped
    # 외부 포트를 열지 않는다: web 만 내부망으로 호출

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  caddy_data:
